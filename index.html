<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生日快乐</title>
  <!-- 引入 Tailwind CSS (CDN版本) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Confetti (撒花特效) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #ffe4e6 100%);
    }

    /* 浮动背景动画 */
    .floating-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      top: 110%;
      opacity: 0;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0% {
        top: 110%;
        opacity: 0;
        transform: rotate(0deg) scale(0.5);
      }

      20% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.6;
      }

      100% {
        top: -10%;
        opacity: 0;
        transform: rotate(360deg) scale(1);
      }
    }

    /* 礼物盒动画 */
    .gift-container {
      position: relative;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .gift-box {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: bounce-gentle 2s infinite ease-in-out;
    }

    @keyframes bounce-gentle {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-10px) rotate(-2deg);
      }

      75% {
        transform: translateY(-5px) rotate(2deg);
      }
    }

    .sparkle-anim {
      animation: pulse-rotate 1.5s infinite;
    }

    @keyframes pulse-rotate {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.2) rotate(15deg);
        opacity: 1;
      }
    }

    /* 贺卡动画 */
    .card-container {
      display: none;
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 24rem;
      padding: 0 1.5rem;
      opacity: 0;
      transform: scale(0.9) translateY(20px);
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-container.show {
      display: block;
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .greeting-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
    }

    .cake-icon {
      transform: scale(0) rotate(-180deg);
      transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-container.show .cake-icon {
      transform: scale(1) rotate(0deg);
    }

    .fade-in-step {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
    }

    .fade-in-step.show {
      opacity: 1;
      transform: translateY(0);
    }

    .heart-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .5;
        transform: scale(1.1);
      }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center">

  <!-- 背景漂浮物 -->
  <div class="floating-bg" id="particles"></div>

  <!-- 初始礼物盒 -->
  <div class="gift-container" id="giftView" onclick="openGift()">
    <div class="gift-box">
      <div class="relative">
        <i data-lucide="gift" class="w-32 h-32 text-rose-400 drop-shadow-md" stroke-width="1.5"></i>
        <div class="absolute -top-2 -right-2 sparkle-anim">
          <i data-lucide="sparkles" class="w-8 h-8 text-yellow-400 drop-shadow-sm"></i>
        </div>
      </div>
      <h1 class="mt-8 text-2xl font-bold text-gray-800 tracking-widest">点击开启惊喜</h1>
      <p class="mt-2 text-rose-400 text-sm font-medium">有一份特别的礼物送给你</p>
    </div>
  </div>

  <!-- 展开后的贺卡 -->
  <div class="card-container" id="cardView">
    <div class="greeting-card">
      <!-- 装饰角 -->
      <div
        class="absolute top-0 left-0 w-24 h-24 bg-gradient-to-br from-rose-200 to-pink-100 rounded-br-full opacity-60">
      </div>
      <div
        class="absolute bottom-0 right-0 w-24 h-24 bg-gradient-to-tl from-purple-200 to-indigo-100 rounded-tl-full opacity-60">
      </div>

      <div class="relative z-10 flex flex-col items-center">
        <div
          class="cake-icon w-24 h-24 bg-gradient-to-br from-rose-100 to-pink-50 rounded-full flex items-center justify-center shadow-inner border border-white mb-8">
          <i data-lucide="cake" class="w-12 h-12 text-rose-500 drop-shadow-sm" stroke-width="1.5"></i>
        </div>

        <div class="text-center space-y-8 w-full">
          <div class="fade-in-step" id="step1">
            <h1
              class="text-4xl font-extrabold bg-gradient-to-r from-rose-500 via-pink-500 to-purple-600 bg-clip-text text-transparent pb-2">
              生日快乐！
            </h1>
            <div class="h-1 w-12 bg-rose-300 mx-auto rounded-full mt-2"></div>
          </div>

          <div class="fade-in-step space-y-4 text-gray-700 text-lg leading-relaxed font-medium" id="step2">
            <p>祝我最亲爱的姐姐生日快乐！<br>新的一岁，颜值在线，好运爆棚，暴富变美，永远被偏爱！</p>
          </div>

          <div class="fade-in-step pt-4 flex justify-center items-center space-x-3 text-rose-500" id="step3">
            <i data-lucide="heart" class="w-6 h-6 fill-current heart-pulse"></i>
            <span class="font-bold tracking-wider">永远快乐，永远耀眼</span>
            <i data-lucide="heart" class="w-6 h-6 fill-current heart-pulse"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 初始化图标
    lucide.createIcons();

    // 生成背景漂浮物
    const particlesContainer = document.getElementById('particles');
    const colors = ['text-yellow-300/60', 'text-rose-300/50', 'bg-purple-300/50', 'bg-pink-300/40'];

    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = `${Math.random() * 100}%`;
      particle.style.animationDelay = `${Math.random() * 10}s`;
      particle.style.animationDuration = `${Math.random() * 15 + 15}s`;

      if (i % 4 === 0) {
        particle.innerHTML = `<i data-lucide="star" class="w-6 h-6 ${colors[0]} drop-shadow-sm" fill="currentColor"></i>`;
      } else if (i % 4 === 1) {
        particle.innerHTML = `<i data-lucide="heart" class="w-8 h-8 ${colors[1]} drop-shadow-sm" fill="currentColor"></i>`;
      } else if (i % 4 === 2) {
        particle.className += ` w-3 h-3 rounded-full ${colors[2]} blur-[1px]`;
      } else {
        particle.className += ` w-5 h-5 rounded-full ${colors[3]} blur-[2px]`;
      }

      particlesContainer.appendChild(particle);
    }
    // 重新初始化新添加的图标
    lucide.createIcons();

    // 撒花特效函数
    function fireConfetti() {
      const duration = 3 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function () {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          return clearInterval(interval);
        }

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
        }));
        confetti(Object.assign({}, defaults, {
          particleCount,
          origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
        }));
      }, 250);
    }

    // 打开礼物逻辑
    function openGift() {
      const giftView = document.getElementById('giftView');
      const cardView = document.getElementById('cardView');
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');
      const step3 = document.getElementById('step3');

      // 隐藏礼物盒
      giftView.style.transform = 'scale(1.2)';
      giftView.style.opacity = '0';
      giftView.style.filter = 'blur(10px)';

      setTimeout(() => {
        giftView.style.display = 'none';
        // 显示贺卡
        cardView.classList.add('show');

        // 触发撒花
        fireConfetti();

        // 依次显示文字
        setTimeout(() => step1.classList.add('show'), 1000);
        setTimeout(() => step2.classList.add('show'), 3000);
        setTimeout(() => step3.classList.add('show'), 5000);
      }, 300);
    }
  </script>
</body>

</html>
